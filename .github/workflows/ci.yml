name: CI and delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Test backend
        run: python -B -W ignore::ResourceWarning -m unittest discover -s tests -p "test_*.py"
      - name: Validate Linux service units
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          from tools.install_linux import units
          folder = Path(os.environ['RUNNER_TEMP']) / 'map-predict-units'
          folder.mkdir(exist_ok=True)
          paths = []
          for name, content in units(Path.cwd(), sys.executable, 'root').items():
              path = folder / name
              path.write_text(content)
              paths.append(str(path))
          subprocess.run(['systemd-analyze', '--man=no', 'verify', *paths], check=True)
          PY
      - name: Test map rendering utilities
        run: node --test tests/basemaps.test.cjs tests/color_adjustments.test.cjs tests/pdf_export.test.cjs tests/assistant.test.cjs
      - name: Package and verify extracted application
        run: python -B tools/package_release.py --output dist/MapPredictApp.zip --smoke-test
  docker:
    name: Verify Docker image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build production image
        run: |
          docker build --tag map-predict-ci .
          docker build --target gemini --tag map-predict-gemini-ci .
          docker build --target ai --tag map-predict-ai-ci .
      - name: Validate Compose without local credentials
        run: docker compose config --quiet
      - name: Prepare private AI network and temporary key
        run: |
          python3 -c "from pathlib import Path; import os,secrets; p=Path(os.environ['RUNNER_TEMP'],'assistant-ci-key'); p.write_text(secrets.token_hex(32)); p.chmod(0o644)"
          docker network create map-predict-ci-network
          docker run -d --name map-predict-ai-ci --network map-predict-ci-network --read-only --tmpfs /tmp -v "${RUNNER_TEMP}/assistant-ci-key:/run/secrets/assistant_key:ro" -e MAP_PREDICT_ASSISTANT_SECRET_FILE=/run/secrets/assistant_key map-predict-ai-ci
      - name: Start image without host credentials
        run: >-
          docker run -d --name map-predict-ci
          --read-only --tmpfs /tmp:rw,nosuid,noexec,size=536870912
          -v "${{ github.workspace }}/models:/app/models:ro"
          -v "${{ github.workspace }}/tests:/app/tests:ro"
          -v "${{ github.workspace }}/layer_du_doan.gpkg:/app/layer_du_doan.gpkg:ro"
          -v "${{ runner.temp }}/assistant-ci-key:/run/secrets/assistant_key:ro"
          --network map-predict-ci-network
          -e MAP_PREDICT_ASSISTANT_ENABLED=1
          -e MAP_PREDICT_ASSISTANT_SECRET_FILE=/run/secrets/assistant_key
          -e MAP_PREDICT_AI_SERVICE_URL=http://map-predict-ai-ci:8001
          -p 127.0.0.1:8766:8000 map-predict-ci
      - name: Verify readiness and mounted model
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/api/v1/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8766/portal/ > /dev/null
          docker exec map-predict-ci python -c "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/predictions/model'))['data']['ready']"
      - name: Test production dependency set
        run: docker exec -e MAP_PREDICT_AI_SERVICE_URL= -e MAP_PREDICT_ASSISTANT_ENABLED=0 map-predict-ci python -B -W ignore::ResourceWarning -m unittest discover -s tests -p "test_*.py"
      - name: Verify live gateway reaches authenticated AI service
        run: |
          curl --fail --silent http://127.0.0.1:8766/api/v1/assistant/status > /dev/null
          docker exec map-predict-ai-ci python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8001/health').status==200"
      - name: Verify private Gemini adapter without account cookies
        run: |
          docker run -d --name map-predict-gemini-ci --read-only --tmpfs /tmp -v "${RUNNER_TEMP}/assistant-ci-key:/run/secrets/assistant_key:ro" map-predict-gemini-ci
          for attempt in $(seq 1 15); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' map-predict-gemini-ci)" = healthy ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' map-predict-gemini-ci)" = healthy
      - name: Container diagnostics
        if: failure()
        run: docker logs map-predict-ci
      - name: Stop CI container
        if: always()
        run: |
          docker rm -f map-predict-ci map-predict-gemini-ci map-predict-ai-ci
          docker network rm map-predict-ci-network
  delivery:
    name: Deliver verified application
    needs: [verify, docker]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package and verify application
        run: python -B tools/package_release.py --output dist/MapPredictApp.zip --smoke-test
      - name: Upload verified application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MapPredictApp-${{ github.sha }}
          path: dist/MapPredictApp.zip
          if-no-files-found: error
          retention-days: 14
  deploy-ready:
    name: Mark verified commit for local deployment
    needs: [verify, docker, delivery]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Publish verified revision
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy-ready"
