name: map-predict

x-worker: &worker
  build:
    context: .
    target: runtime
  restart: unless-stopped
  init: true
  environment:
    MAP_PREDICT_PROXY_HOPS: '1'
    MAP_PREDICT_MAX_UPLOAD_BYTES: '${MAP_PREDICT_MAX_UPLOAD_BYTES:-67108864}'
    MAP_PREDICT_MODEL_DIR: /app/models
    MAP_PREDICT_PROJECT_SOURCE_FOLDER: /app/project-data
  volumes:
    - type: bind
      source: ./models
      target: /app/models
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PROJECT_DATA_PATH:-./Tailieuthamkhao/Giaodienfrontend/luoi}
      target: /app/project-data
      read_only: true
      bind:
        create_host_path: false
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,noexec,size=536870912
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 2g
  cpus: 2
  stop_grace_period: 180s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  app-blue:
    <<: *worker
    image: map-predict-app:blue
  app-green:
    <<: *worker
    image: map-predict-app:green
  app:
    image: nginx@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    restart: unless-stopped
    user: '101:101'
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8765}:8000"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/local/nginx:/etc/nginx/conf.d:ro
    depends_on:
      app-blue:
        condition: service_healthy
      app-green:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=67108864
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  cloudflared:
    image: cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:2000', --protocol, http2, run, --token-file, /run/secrets/tunnel_token]
    depends_on:
      app:
        condition: service_healthy
    secrets: [tunnel_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

secrets:
  tunnel_token:
    file: ./.secrets/cloudflared-token
