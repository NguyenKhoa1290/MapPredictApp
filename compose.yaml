name: map-predict

x-worker: &worker
  build:
    context: .
    target: runtime
  restart: unless-stopped
  init: true
  environment:
    MAP_PREDICT_PROXY_HOPS: '1'
    MAP_PREDICT_MAX_UPLOAD_BYTES: '${MAP_PREDICT_MAX_UPLOAD_BYTES:-67108864}'
    MAP_PREDICT_MODEL_DIR: /app/models
    MAP_PREDICT_PROJECT_SOURCE_FOLDER: /app/project-data
    MAP_PREDICT_ASSISTANT_ENABLED: '${MAP_PREDICT_ASSISTANT_ENABLED:-1}'
    MAP_PREDICT_ASSISTANT_URL: http://gemini:8081/v1
    MAP_PREDICT_ASSISTANT_MODEL: '${MAP_PREDICT_ASSISTANT_MODEL:-gemini-3.6-flash}'
    MAP_PREDICT_ASSISTANT_SECRET_FILE: /run/secrets/assistant_key
    MAP_PREDICT_AI_SERVICE_URL: http://ai:8001
  secrets: [assistant_key]
  volumes:
    - type: bind
      source: ./wwwroot/image
      target: /app/wwwroot/image
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./config
      target: /app/config
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./models
      target: /app/models
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PROJECT_DATA_PATH:-./Tailieuthamkhao/Giaodienfrontend/luoi}
      target: /app/project-data
      read_only: true
      bind:
        create_host_path: false
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,noexec,size=536870912
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 2g
  cpus: 2
  stop_grace_period: 180s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-ai: &ai_worker
  build:
    context: .
    target: ai
  restart: unless-stopped
  init: true
  environment:
    MAP_PREDICT_ASSISTANT_MODEL: '${MAP_PREDICT_ASSISTANT_MODEL:-gemini-3.6-flash}'
    MAP_PREDICT_ASSISTANT_URL: http://gemini:8081/v1
    MAP_PREDICT_ASSISTANT_SECRET_FILE: /run/secrets/assistant_key
    AI_QDRANT_URL: '${AI_QDRANT_URL:-http://qdrant:6333}'
    AI_QDRANT_COLLECTION: '${AI_QDRANT_COLLECTION:-CSDL-Datdai}'
    AI_QDRANT_API_KEY: '${AI_QDRANT_API_KEY:-}'
    AI_QDRANT_VECTOR_NAME: '${AI_QDRANT_VECTOR_NAME:-}'
    AI_EMBEDDING_URL: '${AI_EMBEDDING_URL:-}'
    AI_EMBEDDING_MODEL: '${AI_EMBEDDING_MODEL:-qwen3-embedding:0.6b}'
  secrets: [assistant_key]
  volumes:
    - ./config:/app/config:ro
  extra_hosts: ['host.docker.internal:host-gateway']
  read_only: true
  tmpfs: ['/tmp:rw,nosuid,noexec,size=536870912']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 768m
  cpus: 2
  stop_grace_period: 180s
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: '2'

services:
  gemini:
    image: map-predict-gemini:local
    build:
      context: .
      target: gemini
    restart: unless-stopped
    init: true
    secrets: [assistant_key]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,noexec,size=33554432']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  web:
    <<: *worker
    image: map-predict-web:local
    depends_on:
      ai:
        condition: service_healthy
  ai:
    <<: *ai_worker
    image: map-predict-ai:local
    depends_on:
      qdrant:
        condition: service_healthy
      gemini:
        condition: service_healthy
  qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    restart: unless-stopped
    ports: ['127.0.0.1:6333:6333']
    volumes:
      - type: volume
        source: qdrant_data
        target: /qdrant/storage
        volume:
          nocopy: true
    networks:
      default:
        aliases: [knowledge-qdrant]
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 30s
      timeout: 5s
      start_interval: 2s
      start_period: 20s
      retries: 4
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
  app:
    image: nginx@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    restart: unless-stopped
    user: '101:101'
    entrypoint: [nginx]
    command: [-g, 'daemon off;']
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8765}:8000"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/local/nginx:/etc/nginx/conf.d:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=67108864
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  cloudflared:
    image: cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:2000', --protocol, http2, run, --token-file, /run/secrets/tunnel_token]
    depends_on:
      app:
        condition: service_healthy
    secrets: [tunnel_token]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

secrets:
  assistant_key:
    file: ./.secrets/assistant-key
  tunnel_token:
    file: ./.secrets/cloudflared-token

volumes:
  qdrant_data:
